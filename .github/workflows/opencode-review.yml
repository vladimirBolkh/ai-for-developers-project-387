name: opencode-review

# Независимое авторевью: отдельный воркфлоу от opencode.yml (тот тригигерится
# комментариями /oc). Здесь ревью запускается автоматически на каждый PR и
# оценивает диф по критериям из REVIEW.md.
#
# Бюджет: на один PR — не более MAX_MODEL_RUNS_PER_PR вызовов модели (см.
# job `gate`). Прогоны, где модель не отработала (skipped/cancelled), бюджет
# не едят. Ручной повтор в обход лимита — метка ai-review на PR.
# Имя прогона несёт номер PR — по нему `gate` находит историю ревью ветки.
run-name: opencode-review #${{ github.event.pull_request.number }}

on:
  pull_request:
    # `labeled` нужен только для метки ai-review: добавление любой другой
    # метки порождёт дешёвый прогон gate, который сам себя пропустит.
    types: [opened, synchronize, reopened, ready_for_review, labeled]

# Отмена устаревшего ревью: новый push в PR убивает уже идущий прогон,
# на ветке остаётся только ревью последней ревизии.
concurrency:
  group: opencode-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Предел вызовов модели на один PR. Меняется здесь, без правки логики gate.
  MAX_MODEL_RUNS_PER_PR: '3'

jobs:
  # Дешёвый job без модели: решает, имеет ли смысл звать ревьюер.
  gate:
    name: Budget check
    # Статические условия (форк/draft/бот/метка) — здесь, чтобы такие прогоны
    # заканчивались skipped и не числились в бюджете.
    if: |
      (github.event.action != 'labeled' || github.event.label.name == 'ai-review') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      !endsWith(github.event.pull_request.user.login, '[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read # история прогонов workflow для подсчёта бюджета
    outputs:
      review: ${{ steps.budget.outputs.review }}
    steps:
      - name: Count model runs for this PR
        id: budget
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const MAX = Number(process.env.MAX_MODEL_RUNS_PER_PR);
            const runName = `opencode-review #${pr.number}`;

            // Метка ai-review — ручной обход лимита: снимает бюджет сразу.
            if (pr.labels.some((label) => label.name === 'ai-review')) {
              core.info(`Метка ai-review: лимит ${MAX} вызовов не применяется`);
              core.setOutput('review', 'true');
              return;
            }

            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              branch: pr.head.ref,
              event: 'pull_request',
              per_page: 100,
            });

            // Считаем только прогоны, где модель реально отработала: успех,
            // ошибка или таймаут. Skipped (лимит/условия) и cancelled
            // (устаревшие под конкуренцией) бюджет не едят.
            let used = 0;
            for (const run of data.workflow_runs) {
              if (run.name !== runName || run.id === context.runId) continue;
              if (!['success', 'failure', 'timed_out'].includes(run.conclusion ?? '')) {
                continue;
              }
              const jobs = await github.rest.actions.listJobsForWorkflowRun({
                owner,
                repo,
                run_id: run.id,
                filter: 'latest',
              });
              const review = jobs.data.jobs.find((job) => job.name === 'AI review');
              if (review && !['skipped', 'cancelled'].includes(review.conclusion ?? '')) {
                used++;
              }
              if (used >= MAX) break;
            }

            if (used >= MAX) {
              core.warning(
                `Лимит авторевью исчерпан: ${used}/${MAX}. Повтор — меткой ai-review.`,
              );
              core.setOutput('review', 'false');
            } else {
              core.info(`Авторевью разрешено: использовано ${used}/${MAX}.`);
              core.setOutput('review', 'true');
            }

  review:
    name: AI review
    needs: gate
    # gate пропущен (fork/draft/бот/чужая метка) → needs не выполнен → skipped.
    if: needs.gate.outputs.review == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write # OIDC-обмен → токен App opencode-agent (комменты в PR)
      contents: read # checkout
      pull-requests: read # контекст PR
      issues: read # комментарии PR идут через issues API
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Вся история: ревьюеру нужен диф против базовой ветки и master
          fetch-depth: 0
          persist-credentials: false

      - name: Run OpenCode review
        # Пин синхронен с opencode.yml: v2.1.4 — последний релиз, шипящий
        # github/action.yml (см. комментарий в opencode.yml). Бампить вместе.
        uses: anomalyco/opencode/github@v2.1.4
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/big-pickle
          share: 'true'
          prompt: |
            Проведи независимое авторевью этого pull request.

            1. Прочитай критерии в REVIEW.md. Если этот PR сам меняет REVIEW.md,
               бери критерии из базовой ветки: `git show origin/master:REVIEW.md`,
               и отдельной находкой отметь, что критерии в PR меняются.
            2. Ревьюи диф ветки относительно базовой ветки — смотри на изменения,
               контекст подтягивай по мере нужды.
            3. Оценивай находки по уровням важности из REVIEW.md (blocker, major,
               minor, nit) и привязывай к файлу и строке.
            4. Оставь ровно один комментарий к PR по разделу «Формат вывода»
               REVIEW.md: вердикт (approve / needs fixes), находки, оценка риска
               и способа отката.
            5. Ты ревьюер, а не автор: ничего не коммить, не пушь, не создавай
               веток и PR, не меняй REVIEW.md и шаблон PR.

            Если REVIEW.md отсутствует или нечитаем — используй общие критерии
            проекта (Conventional Commits, ловушки конфигов из AGENTS.md, тесты,
            доменные термины из GLOSSARY.md) и напиши об этом в комментарии.
