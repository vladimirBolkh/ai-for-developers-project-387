# Еженедельная проверка зависимостей: PR с обновлениями npm-пакетов и GitHub Actions
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Коммиты Dependabot в формате Conventional Commits ("build(deps): bump ..."),
    # чтобы их пропускал commitlint (CI job "Conventional Commits")
    commit-message:
      prefix: build
      include: scope
    ignore:
      # typescript-eslint@8 поддерживает только TypeScript < 6.1 — мажорные апдейты ломают npm ci (ERESOLVE)
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # То же для обновлений GitHub Actions: "build(deps): bump ..."
    commit-message:
      prefix: build
      include: scope
