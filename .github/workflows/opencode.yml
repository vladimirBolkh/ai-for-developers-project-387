name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    # Срабатываем на /oc или /opencode в начале комментария или после пробела,
    # чтобы не ловить совпадения внутри других слов (например /oauth-flow).
    if: |
      startsWith(github.event.comment.body, '/oc') ||
      startsWith(github.event.comment.body, '/opencode') ||
      contains(github.event.comment.body, ' /oc') ||
      contains(github.event.comment.body, ' /opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC-обмен → токен App opencode-agent (комменты, push)
      contents: read # checkout
      pull-requests: read # чтение контекста PR
      issues: read # чтение контекста issue
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/mimo-v2.6-flash-free
          share: 'true'
