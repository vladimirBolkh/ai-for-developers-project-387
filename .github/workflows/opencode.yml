name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Ограничение параллельных запусков: не больше одного агента на конкретный
# issue/PR, новый вызов отменяет уже идущий по этому же объекту.
concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  opencode:
    # Запускаем только если:
    #  1) в комментарии есть команда /oc или /opencode (в начале или после пробела,
    #     чтобы не ловить совпадения внутри других слов, напр. /oauth-flow);
    #  2) автор — доверенный участник (OWNER / MEMBER / COLLABORATOR);
    #  3) автор не бот (чтобы избежать зацикливания бот↔бот).
    # Недоверенные участники и форки просто не проходят условие и не получают секрет.
    if: |
      (
        startsWith(github.event.comment.body, '/oc') ||
        startsWith(github.event.comment.body, '/opencode') ||
        contains(github.event.comment.body, ' /oc') ||
        contains(github.event.comment.body, ' /opencode')
      ) &&
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      ) &&
      !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write # OIDC-обмен → токен App opencode-agent (комменты, push)
      contents: read # checkout
      pull-requests: read # чтение контекста PR
      issues: read # чтение контекста issue
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        # Pinned to v2.1.4 (2026-10 release). The **highest** anomalyco/opencode
        # release tag that ships `github/action.yml`. `v2.2.0`, `v2.2.1` and
        # `v2.2.2` no longer publish that sub-directory, and there is no
        # `refs/heads/latest` branch on the repo (GitHub's `@latest` alias
        # resolves to the highest semver tag, which is broken). Re-test the
        # river on every new v2.x release and bump here.
        uses: anomalyco/opencode/github@v2.1.4
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          # One-shot quota probe (2026-10-29). Tests whether the 429
          # `FreeUsageLimitError` we hit on `mimo-v2.6-flash-free` is
          # per-model or per-account. Big Pickle is the only model
          # listed in the OpenCode Go FAQ as a guaranteed free option
          # ("Free models include Big Pickle plus promotional models").
          model: opencode/big-pickle
          share: 'true'
